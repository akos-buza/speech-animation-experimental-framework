const triangleAnimationDemo = {

  type: jsPsychCanvasButtonResponse,

  canvas_size: [450, 800],

  stimulus: function(canvas) {

    const ctx = canvas.getContext("2d");

    let replayStarted = false;
    let animationRunning = false;

    function playAnimation() {

      animationRunning = true;

      let x = -50;
      const targetX = 260;

      function drawFrame() {

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        /* monitor */

        ctx.fillStyle = "#222";
        ctx.fillRect(40, 40, 720, 350);

        ctx.fillStyle = "white";
        ctx.fillRect(55, 55, 690, 320);

        /* clip */

        ctx.save();

        ctx.beginPath();
        ctx.rect(55, 55, 690, 320);
        ctx.clip();

        /* triangle */

        ctx.fillStyle = "#3a66ff";

        ctx.beginPath();
        ctx.moveTo(x, 230);
        ctx.lineTo(x + 40, 170);
        ctx.lineTo(x + 80, 230);
        ctx.closePath();
        ctx.fill();

        ctx.restore();

        if (x < targetX) {

          x += 3;
          requestAnimationFrame(drawFrame);

        } else {

          animationRunning = false;

          if (replayStarted) {

            const buttons = document.querySelectorAll("button");

            const continueButton = buttons[buttons.length - 1];

            continueButton.disabled = false;
            continueButton.style.opacity = "1";
            continueButton.style.cursor = "pointer";

            statusText.style.color = "#008800";

            statusText.innerHTML =
              "Az animáció újrajátszása befejeződött. Most továbbléphet a észlelési feladathoz.";

          }

        }

      }

      drawFrame();

    }

    /* automatic first playback */

    playAnimation();

    /* replay button */

    const replayButton = document.createElement("button");

    replayButton.innerText = "Animáció újrajátszása";
    replayButton.style.marginTop = "15px";

    replayButton.onclick = function() {

      if (animationRunning) return;

      replayStarted = true;

      statusText.style.color = "#aa0000";

      statusText.innerHTML =
        "Az animáció újrajátszása folyamatban...";

      playAnimation();

    };

    canvas.parentElement.appendChild(document.createElement("br"));
    canvas.parentElement.appendChild(replayButton);

    /* target sentence */

    const textDiv = document.createElement("div");

    textDiv.innerHTML = `

      <div style="
        margin-top:20px;
        text-align:center;
      ">

        <p style="
          font-size:20px;
          color:#444;
          margin-bottom:12px;
        ">
          Figyelmesen nézze meg az animációt.
        </p>

        <p style="
          font-size:22px;
          font-weight:bold;
          margin-bottom:12px;
        ">
          Célmondat
        </p>

        <p style="
          font-size:28px;
          font-weight:bold;
          color:#003366;
          margin-bottom:18px;
        ">
          „Megjelent egy háromszög a képernyőn.”
        </p>

        <p style="
          font-size:16px;
          color:#555;
          max-width:650px;
          margin:auto;
        ">
          A következő oldalon egy ehhez a mondathoz tartozó
          helykitöltő hangfelvételt fog hallani.
          Ezt követően egy vagy több észlelési feladatot kell elvégeznie.
        </p>

      </div>

    `;

    canvas.parentElement.appendChild(textDiv);

    /* status */

    const statusText = document.createElement("p");

    statusText.style.marginTop = "15px";
    statusText.style.fontWeight = "bold";
    statusText.style.color = "#aa0000";

    statusText.innerHTML =
      "Kérjük, a továbblépés előtt egyszer játssza le újra az animációt.";

    canvas.parentElement.appendChild(statusText);

    /* disable Continue */

    setTimeout(() => {

      const buttons = document.querySelectorAll("button");

      if (buttons.length > 1) {

        const continueButton = buttons[buttons.length - 1];

        continueButton.disabled = true;
        continueButton.style.opacity = "0.5";
        continueButton.style.cursor = "not-allowed";

      }

    }, 100);

  },

  choices: ["Tovább"]

};

const pushAnimationDemo = {
  type: jsPsychCanvasButtonResponse,

  canvas_size: [450, 800],

  stimulus: function(canvas) {

    const ctx = canvas.getContext("2d");

    let replayStarted = false;
    let animationRunning = false;

    function playAnimation() {

      animationRunning = true;

      let squareX = 500;
      let triangleX = 260;

      const squareHome = 500;

      let phase = 1;

      function drawFrame() {

        ctx.clearRect(0,0,canvas.width,canvas.height);

        /* monitor */

        ctx.fillStyle="#222";
        ctx.fillRect(40,40,720,350);

        ctx.fillStyle="white";
        ctx.fillRect(55,55,690,320);

        /* clip */

        ctx.save();

        ctx.beginPath();
        ctx.rect(55,55,690,320);
        ctx.clip();

        /* movement */

        if(phase===1){

          squareX-=4;

          if(squareX<=340){
            phase=2;
          }

        } else if(phase===2){

          squareX-=4;
          triangleX-=4;

          if(triangleX<-100){
            phase=3;
          }

        } else if(phase===3){

          squareX+=4;

          if(squareX>=squareHome){
            squareX=squareHome;
            phase=4;
          }

        }

        /* triangle */

        if(triangleX>-100){

          ctx.fillStyle="#3a66ff";

          ctx.beginPath();
          ctx.moveTo(triangleX,230);
          ctx.lineTo(triangleX+40,170);
          ctx.lineTo(triangleX+80,230);
          ctx.closePath();
          ctx.fill();

        }

        /* square */

        ctx.fillStyle="#d62828";
        ctx.fillRect(squareX,150,120,120);

        ctx.restore();

        if(phase!==4){

          requestAnimationFrame(drawFrame);

        } else {

          animationRunning=false;

          if(replayStarted){

            const buttons=document.querySelectorAll("button");

            const continueButton=buttons[buttons.length-1];

            continueButton.disabled=false;
            continueButton.style.opacity="1";
            continueButton.style.cursor="pointer";

            statusText.style.color="#008800";

            statusText.innerHTML=
              "Az animáció újrajátszása befejeződött. Most továbbléphet az észlelési feladathoz.";

          }

        }

      }

      drawFrame();

    }

    playAnimation();

    /* replay button */

    const replayButton=document.createElement("button");

    replayButton.innerText="Animáció újrajátszása";
    replayButton.style.marginTop="15px";

    replayButton.onclick=function(){

      if(animationRunning) return;

      replayStarted=true;

      statusText.style.color="#aa0000";

      statusText.innerHTML="Az animáció újrajátszása folyamatban...";

      playAnimation();

    };

    canvas.parentElement.appendChild(document.createElement("br"));
    canvas.parentElement.appendChild(replayButton);

    /* text */

    const textDiv=document.createElement("div");

    textDiv.innerHTML=`

      <div style="
        margin-top:20px;
        text-align:center;
      ">

        <p style="
          font-size:20px;
          color:#444;
          margin-bottom:12px;
        ">
          Figyelmesen nézze meg az animációt.
        </p>

        <p style="
          font-size:22px;
          font-weight:bold;
          margin-bottom:12px;
        ">
          Célmondat
        </p>

        <p style="
          font-size:28px;
          font-weight:bold;
          color:#003366;

const eatingAnimationDemo = {

  type: jsPsychCanvasButtonResponse,

  canvas_size: [450, 800],

  stimulus: function(canvas) {

    const ctx = canvas.getContext("2d");

    let replayStarted = false;
    let animationRunning = false;

    function playAnimation() {

      animationRunning = true;

      let squareX = 500;
      let mouthOpen = 0;

      function drawFrame() {

        ctx.clearRect(0,0,canvas.width,canvas.height);

        /* monitor */

        ctx.fillStyle="#222";
        ctx.fillRect(40,40,720,350);

        ctx.fillStyle="white";
        ctx.fillRect(55,55,690,320);

        /* clip */

        ctx.save();

        ctx.beginPath();
        ctx.rect(55,55,690,320);
        ctx.clip();

        /* mouth animation */

        mouthOpen =
          squareX > 270
            ? 0.45 + 0.12 * Math.sin(squareX * 0.08)
            : 0;

        /* green circle */

        ctx.fillStyle="#2ca02c";

        ctx.beginPath();
        ctx.moveTo(220,210);

        ctx.arc(
          220,
          210,
          75,
          mouthOpen,
          2*Math.PI-mouthOpen
        );

        ctx.closePath();
        ctx.fill();

        /* red square */

        if(squareX > 270){

          ctx.fillStyle="#d62828";

          ctx.fillRect(
            squareX + 15,
            165,
            90,
            90
          );

        }

        ctx.restore();

        if(squareX > 270){

          squareX -= 4;
          requestAnimationFrame(drawFrame);

        } else {

          /* final frame */

          ctx.clearRect(0,0,canvas.width,canvas.height);

          ctx.fillStyle="#222";
          ctx.fillRect(40,40,720,350);

          ctx.fillStyle="white";
          ctx.fillRect(55,55,690,320);

          ctx.save();

          ctx.beginPath();
          ctx.rect(55,55,690,320);
          ctx.clip();

          ctx.fillStyle="#2ca02c";

          ctx.beginPath();
          ctx.arc(
            220,
            210,
            75,
            0,
            2*Math.PI
          );
          ctx.fill();

          ctx.restore();

          animationRunning=false;

          if(replayStarted){

            const buttons=document.querySelectorAll("button");

            const continueButton=buttons[buttons.length-1];

            continueButton.disabled=false;
            continueButton.style.opacity="1";
            continueButton.style.cursor="pointer";

            statusText.style.color="#008800";

            statusText.innerHTML=
              "Az animáció újrajátszása befejeződött. Most továbbléphet az észlelési feladathoz.";

          }

        }

      }

      drawFrame();

    }

    /* first automatic play */

    playAnimation();

    /* replay button */

    const replayButton=document.createElement("button");

    replayButton.innerText="Animáció újrajátszása";
    replayButton.style.marginTop="15px";

    replayButton.onclick=function(){

      if(animationRunning) return;

      replayStarted=true;

      statusText.style.color="#aa0000";

      statusText.innerHTML=
        "Az animáció újrajátszása folyamatban...";

      playAnimation();

    };

    canvas.parentElement.appendChild(document.createElement("br"));
    canvas.parentElement.appendChild(replayButton);

    /* text */

    const textDiv=document.createElement("div");

    textDiv.innerHTML=`

      <div style="
        margin-top:20px;
        text-align:center;
      ">

        <p style="
          font-size:20px;
          color:#444;
          margin-bottom:12px;
        ">
          Figyelmesen nézze meg az animációt.
        </p>

        <p style="
          font-size:22px;
          font-weight:bold;
          margin-bottom:12px;
        ">
          Célmondat
        </p>

        <p style="
          font-size:28px;
          font-weight:bold;
          color:#003366;
          margin-bottom:18px;
        ">
          „A kör megette a négyzetet.”
        </p>

        <p style="
          font-size:16px;
          color:#555;
          max-width:650px;
          margin:auto;
        ">
          A következő oldalon egy ehhez a mondathoz tartozó
          helykitöltő hangfelvételt fog hallani.
          Ezt követően egy vagy több észlelési feladatot kell elvégeznie.
        </p>

      </div>

    `;

    canvas.parentElement.appendChild(textDiv);

    /* status */

    const statusText=document.createElement("p");

    statusText.style.marginTop="15px";
    statusText.style.fontWeight="bold";
    statusText.style.color="#aa0000";

    statusText.innerHTML=
      "Kérjük, a továbblépés előtt egyszer játssza le újra az animációt.";

    canvas.parentElement.appendChild(statusText);

    /* disable Continue */

    setTimeout(()=>{

      const buttons=document.querySelectorAll("button");

      if(buttons.length>1){

        const continueButton=buttons[buttons.length-1];

        continueButton.disabled=true;
        continueButton.style.opacity="0.5";
        continueButton.style.cursor="not-allowed";

      }

    },100);

  },

  choices:["Tovább"]

};
