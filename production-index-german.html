/* =========================
   TRIANGLE ANIMATION DEMO
   ========================= */

const triangleDemo = {
  type: jsPsychCanvasButtonResponse,

  canvas_size: [450, 800],

  stimulus: function(canvas) {

    const ctx = canvas.getContext("2d");

    let replayCompleted = false;
    let animationRunning = false;
    let replayStarted = false;

    function playAnimation() {

      animationRunning = true;

      let x = -50;
      const targetX = 260;

      function drawFrame() {

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        /* monitor */

        ctx.fillStyle = "#222";
        ctx.fillRect(40, 40, 720, 350);

        ctx.fillStyle = "white";
        ctx.fillRect(55, 55, 690, 320);

        /* clip */

        ctx.save();

        ctx.beginPath();
        ctx.rect(55, 55, 690, 320);
        ctx.clip();

        /* triangle */

        ctx.fillStyle = "#3a66ff";

        ctx.beginPath();
        ctx.moveTo(x, 230);
        ctx.lineTo(x + 40, 170);
        ctx.lineTo(x + 80, 230);
        ctx.closePath();
        ctx.fill();

        ctx.restore();

        if (x < targetX) {

          x += 3;
          requestAnimationFrame(drawFrame);

        } else {

          animationRunning = false;

          if (replayStarted) {

            replayStarted = true;

            const buttons = document.querySelectorAll("button");

            const continueButton = buttons[buttons.length - 1];

            continueButton.disabled = false;
            continueButton.style.opacity = "1";
            continueButton.style.cursor = "pointer";

            statusText.style.color = "#008800";

            statusText.innerHTML =
              "Die Animation wurde erneut abgespielt. Sie können nun mit der Aufgabe fortfahren.";
          }
        }
      }

      drawFrame();
    }

    /* first automatic play */

    playAnimation();

    /* replay button */

    const replayButton = document.createElement("button");
    replayButton.innerText = "Animation erneut abspielen";
    replayButton.style.marginTop = "15px";

    replayButton.onclick = function() {

      if (animationRunning) return;

      replayStarted = true;

      statusText.innerHTML =
        "Animation wird erneut abgespielt...";

      playAnimation();
    };

    canvas.parentElement.appendChild(document.createElement("br"));
    canvas.parentElement.appendChild(replayButton);

    /* sentence */

    const textDiv = document.createElement("div");

    textDiv.innerHTML = `
      <div style="
        margin-top:20px;
        text-align:center;
      ">

        <p style="
          font-size:20px;
          color:#444;
          margin-bottom:12px;
        ">
          Was ist passiert?
        </p>

        <p style="
          font-size:28px;
          font-weight:bold;
          margin-bottom:18px;
        ">
          Ein Dreieck erschien im Bild.
        </p>

        <p style="
          font-size:16px;
          color:#555;
        ">
          Sehen Sie sich die Animation an und lesen Sie anschließend den Satz still.
        </p>

      </div>
    `;

    canvas.parentElement.appendChild(textDiv);

    /* status message */

    const statusText = document.createElement("p");

    statusText.style.marginTop = "15px";
    statusText.style.fontWeight = "bold";
    statusText.style.color = "#aa0000";

    statusText.innerHTML =
      "Bitte spielen Sie die Animation erneut ab, bevor Sie fortfahren.";

    canvas.parentElement.appendChild(statusText);

    /* disable Continue button */

    setTimeout(() => {

      const buttons = document.querySelectorAll("button");

      if (buttons.length > 1) {

        const continueButton = buttons[buttons.length - 1];

        continueButton.disabled = true;
        continueButton.style.opacity = "0.5";
        continueButton.style.cursor = "not-allowed";

      }

    }, 100);

  },

  choices: ["Weiter"]

};

/* =========================

   ========================= */

const pushDemo = {
  type: jsPsychCanvasButtonResponse,

  canvas_size: [450, 800],

  stimulus: function(canvas) {

    const ctx = canvas.getContext("2d");

    let replayStarted = false;
    let animationRunning = false;

    function playAnimation() {

      animationRunning = true;

      let squareX = 500;
      let triangleX = 260;

      const squareHome = 500;

      let phase = 1;

      function drawFrame() {

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        /* monitor */

        ctx.fillStyle = "#222";
        ctx.fillRect(40, 40, 720, 350);

        ctx.fillStyle = "white";
        ctx.fillRect(55, 55, 690, 320);

        /* clip */

        ctx.save();

        ctx.beginPath();
        ctx.rect(55, 55, 690, 320);
        ctx.clip();

        /* movement logic */

        if (phase === 1) {

          squareX -= 4;

          if (squareX <= 340) {
            phase = 2;
          }

        } else if (phase === 2) {

          squareX -= 4;
          triangleX -= 4;

          if (triangleX < -100) {
            phase = 3;
          }

        } else if (phase === 3) {

          squareX += 4;

          if (squareX >= squareHome) {
            squareX = squareHome;
            phase = 4;
          }
        }

        /* triangle */

        if (triangleX > -100) {

          ctx.fillStyle = "#3a66ff";

          ctx.beginPath();
          ctx.moveTo(triangleX, 230);
          ctx.lineTo(triangleX + 40, 170);
          ctx.lineTo(triangleX + 80, 230);
          ctx.closePath();
          ctx.fill();
        }

        /* square */

        ctx.fillStyle = "#d62828";

        ctx.fillRect(
          squareX,
          150,
          120,
          120
        );

        ctx.restore();

        if (phase !== 4) {

          requestAnimationFrame(drawFrame);

        } else {

          animationRunning = false;

          if (replayStarted) {

            const buttons =
              document.querySelectorAll("button");

            const continueButton =
              buttons[buttons.length - 1];

            continueButton.disabled = false;
            continueButton.style.opacity = "1";
            continueButton.style.cursor = "pointer";

            statusText.style.color = "#008800";

            statusText.innerHTML =
              "Az animáció újrajátszása megtörtént. Folytathatja a feladatot.";
          }
        }
      }

      drawFrame();
    }

    /* first automatic play */

    playAnimation();

    /* replay button */

    const replayButton = document.createElement("button");

    replayButton.innerText =
      "Animáció újrajátszása";

    replayButton.style.marginTop = "15px";

    replayButton.onclick = function() {

      if (animationRunning) return;

      replayStarted = true;

      statusText.style.color = "#aa0000";

      statusText.innerHTML =
        "Az animáció újrajátszása folyamatban van...";

      playAnimation();
    };

    canvas.parentElement.appendChild(
      document.createElement("br")
    );

    canvas.parentElement.appendChild(
      replayButton
    );

    /* text */

    const textDiv = document.createElement("div");

    textDiv.innerHTML = `
  <div style="
    margin-top:20px;
    text-align:center;
  ">

    <p style="
      font-size:20px;
      color:#444;
      margin-bottom:12px;
    ">
      Melyik alakzat lökte ki a másikat a képből?

    <p style="
      font-size:28px;
      font-weight:bold;
      margin-bottom:18px;
    ">
      A négyszög lökte ki a háromszöget.
    </p>

    <p style="
      font-size:16px;
      color:#555;
    ">
      Nézze meg az animációt, majd olvassa el magában a mondatot.
    </p>

  </div>
    `;

    canvas.parentElement.appendChild(textDiv);

    /* status message */

    statusText.style.marginTop = "15px";
    statusText.style.fontWeight = "bold";

        continueButton.disabled = true;
        continueButton.style.opacity = "0.5";
        continueButton.style.cursor = "not-allowed";

  choices: ["Continue"]

  },

    <canvas
      id="push-reminder"
      width="300"
      height="120"
      style="
        border:1px solid #999;
        display:block;
        margin:15px auto;
      ">
    </canvas>

    <button id="replay-push">
      Animation erneut abspielen

    <img
      src="x"
      style="display:none"
      onerror="
        const c = document.getElementById('push-reminder');
        const ctx = c.getContext('2d');
        const replayBtn = document.getElementById('replay-push');

        let running = false;

        function animate() {

          let squareX = 180;
          let triangleX = 80;

          let phase = 1;

          running = true;

          function drawFrame() {

            ctx.clearRect(0,0,300,120);

            /* movement logic */

            if (phase === 1) {

              squareX -= 2;

              if (squareX <= 120) {
                phase = 2;
              }

            } else if (phase === 2) {

              squareX -= 2;
              triangleX -= 2;

              squareX += 2;

              if (squareX >= 180) {
                squareX = 180;
                phase = 4;
              }
            }
